<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- D-257: fontconfig fisso per il Chromium delle catene (FONTCONFIG_FILE, tools/catena.mjs). Il testo del gioco usa
     solo i caratteri inclusi (src/resa/caratteri.css); qui i caratteri di sistema sono solo DejaVu e Liberation, come
     su una macchina senza Inter, e la resa è senza hinting: avanzamenti frazionari come sui telefoni, uguali in locale
     e in CI (con l'hinting di serie le larghezze si arrotondano al pixel e gli a capo cambiano). -->
<fontconfig>
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <dir>/usr/share/fonts/truetype/liberation</dir>
  <dir>/usr/share/fonts/truetype/liberation2</dir>
  <cachedir prefix="xdg">fontconfig-vandelfalls</cachedir>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="embolden" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
